[project]
name = "surf-feel"
version = "0.1.0"
description = "言語化できないサーフィンのフィーリングを言語化し、それに合うボードを提案するアプリ"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
distill = ["yt-dlp"]

[project.scripts]
surf-feel = "surf_feel.cli:main"
surf-feel-web = "surf_feel.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surf_feel = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
